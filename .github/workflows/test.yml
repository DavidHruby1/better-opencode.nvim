name: test
on:
  push:
  pull_request:
jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [unit, integration, contract]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: v0.11.0
          neovim: true
      - uses: actions/checkout@v4
        with:
          repository: echasnovski/mini.nvim
          ref: v0.16.0
          path: .deps/mini.nvim
      - run: MINI_TEST_PATH=$PWD/.deps/mini.nvim nvim --headless -u tests/minimal_init.lua -c "lua MiniTest.run({ collect = { find_files = function() return vim.fn.globpath('tests/${{ matrix.suite }}', 'test_*.lua', false, true) end } })"
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode: [1.17.3, 1.18.9]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: v0.11.0
          neovim: true
      - run: npm install --global opencode-ai@${{ matrix.opencode }}
      - run: test "$(opencode --version)" = "${{ matrix.opencode }}"
      - run: mkdir -p "$HOME/.local/share/opencode" && install -m 600 /dev/stdin "$HOME/.local/share/opencode/auth.json" <<<"$OPENCODE_E2E_AUTH_JSON"
        shell: bash
        env:
          OPENCODE_E2E_AUTH_JSON: ${{ secrets.OPENCODE_E2E_AUTH_JSON }}
      - run: tests/e2e/run.sh
        env:
          OPENCODE_VERSION: ${{ matrix.opencode }}
