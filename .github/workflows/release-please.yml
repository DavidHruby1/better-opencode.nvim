name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  discussions: write

jobs:
  release-acceptance:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: v0.11.0
          neovim: true
      - uses: actions/checkout@v4
        with:
          repository: folke/snacks.nvim
          path: .deps/snacks.nvim
      - uses: actions/checkout@v4
        with:
          repository: echasnovski/mini.nvim
          ref: v0.16.0
          path: .deps/mini.nvim
      - name: Install authenticated E2E credentials
        run: mkdir -p "$HOME/.local/share/opencode" && install -m 600 /dev/stdin "$HOME/.local/share/opencode/auth.json" <<<"$OPENCODE_E2E_AUTH_JSON"
        shell: bash
        env:
          OPENCODE_E2E_AUTH_JSON: ${{ secrets.OPENCODE_E2E_AUTH_JSON }}
      - name: Validate OpenCode 1.17.3
        run: npm install --global opencode-ai@1.17.3 && tests/release/run.sh
        env:
          OPENCODE_VERSION: 1.17.3
          SNACKS_PATH: ${{ github.workspace }}/.deps/snacks.nvim
          MINI_TEST_PATH: ${{ github.workspace }}/.deps/mini.nvim
      - name: Validate OpenCode 1.18.9
        run: npm install --global opencode-ai@1.18.9 && tests/release/run.sh
        env:
          OPENCODE_VERSION: 1.18.9
          SNACKS_PATH: ${{ github.workspace }}/.deps/snacks.nvim
          MINI_TEST_PATH: ${{ github.workspace }}/.deps/mini.nvim
      - name: Require complete release evidence
        run: nvim --headless -u NONE -c "lua assert(dofile('tests/release/evidence.lua').generate('.', 'tests/release/results/index.lua', 'docs/release/v2.0-evidence.md'))" -c 'qa!'

  release-please:
    if: github.event.repository.fork == false
    needs: release-acceptance
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      - name: Attach discussion
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
        run: |
          RELEASE_ID=$(gh api \
            repos/${{ github.repository }}/releases/tags/${{ steps.release.outputs.tag_name }} \
            --jq '.id')

          gh api --method PATCH \
            repos/${{ github.repository }}/releases/$RELEASE_ID \
            -f discussion_category_name='Announcements'
